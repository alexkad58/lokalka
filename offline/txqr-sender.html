    <style>:root{color-scheme:light;font-family:Trebuchet MS,Segoe UI,sans-serif;color:#17221f;background:#e8eee8}*{box-sizing:border-box}body{min-width:320px;min-height:100vh;margin:0;background:radial-gradient(circle at 12% 8%,rgba(255,255,255,.9),transparent 34%),linear-gradient(135deg,#e8eee8,#d7e2df 52%,#f3eee5)}button,input,select{font:inherit}.app-shell{width:min(1120px,calc(100% - 32px));margin:0 auto;padding:48px 0}.page-header{max-width:720px;margin-bottom:28px}.eyebrow{margin:0 0 12px;color:#a0442d;font-size:.76rem;font-weight:800;letter-spacing:.12em}h1{margin:0;font-family:Georgia,Times New Roman,serif;font-size:clamp(2rem,5vw,4.4rem);line-height:.98;font-weight:500}.intro{max-width:520px;margin:18px 0 0;color:#53635e;font-size:1.05rem}.workspace{display:grid;grid-template-columns:minmax(280px,.8fr) minmax(360px,1.2fr);gap:28px;align-items:start}.controls,.qr-stage{border:1px solid rgba(23,34,31,.14);border-radius:8px;background:#ffffffb8;box-shadow:0 22px 60px #2d3f391f}.controls{display:grid;gap:18px;padding:24px}.file-picker,label{display:grid;gap:8px;color:#53635e;font-size:.84rem;font-weight:700}.file-picker input{width:100%;padding:12px;border:1px dashed #a0442d;border-radius:6px;background:#fffaf4;color:#17221f}.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}select{width:100%;padding:11px 12px;border:1px solid #bdc9c4;border-radius:6px;background:#fff;color:#17221f}.file-summary,.status{min-height:44px;padding:12px 14px;border-radius:6px;background:#edf3ef;color:#53635e;font-size:.9rem}.status[data-tone=error]{background:#f8e5df;color:#8d321f}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}button{min-height:46px;padding:10px 14px;border:0;border-radius:6px;background:#a0442d;color:#fff;cursor:pointer;font-weight:800}button.secondary{background:#d9e2de;color:#273a34}button:disabled{cursor:not-allowed;opacity:.45}.qr-stage{display:grid;justify-items:center;gap:16px;padding:22px}#qr-canvas{display:block;width:min(100%   <body>
    <main class="app-shell">
      <header class="page-header">
        <p class="eyebrow">LOKALKA / TXQR</p>
        <h1>Передача PDF через QR</h1>
        <p class="intro">Выберите PDF, затем наведите сканер сайта на анимацию.</p>
      </header>

      <section class="workspace" aria-label="Передача PDF">
        <div class="controls">
          <label class="file-picker">
            <span>PDF-файл</span>
            <input id="file-input" type="file" accept="application/pdf,.pdf" />
          </label>

          <div class="settings-grid">
            <label>
              <span>Размер блока</span>
              <select id="chunk-size">
                <option value="500">500 байт</option>
                <option value="700" selected>700 байт</option>
                <option value="900">900 байт</option>
              </select>
            </label>
            <label>
              <span>Избыточность</span>
              <select id="redundancy">
                <option value="0.5" selected>50%</option>
                <option value="0.75">75%</option>
                <option value="1">100%</option>
              </select>
            </label>
          </div>

          <div class="file-summary" id="file-summary">PDF еще не выбран</div>
          <div class="actions">
            <button id="start-button" type="button" disabled>Запустить передачу</button>
            <button id="stop-button" type="button" class="secondary" disabled>Остановить</button>
          </div>
          <div class="status" id="status" role="status">Готово к выбору файла</div>
        </div>

        <div class="qr-stage">
          <canvas id="qr-canvas" width="560" height="560" aria-label="Текущий QR-кадр"></canvas>
          <div class="progress-line">
            <span id="frame-counter">Нет активной передачи</span>
            <span id="elapsed">00:00</span>
          </div>
          <progress id="progress" value="0" max="1"></progress>
        </div>
      </section>
    </main>
  </body>
</html>
